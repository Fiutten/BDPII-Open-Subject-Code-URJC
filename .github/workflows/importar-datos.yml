name: Completar conjunto de datos docente

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/importar-datos.yml"

permissions:
  contents: write

jobs:
  importar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar copia exacta del conjunto de datos público
        run: |
          destino="codigo/Tema_02_Streaming_Tiempo_Real/recursos_kafka/sensores_deportivos_fatiga.csv"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/Fiutten/BDPII-Open-Subject-2026/main/material_abierto/06_programas/$destino" \
            --output "$destino"
          echo "1c987be85da4a56d6d8d5bb32d49e6ea3925ce69f22fee3cb82dbcd273ad4ca6  $destino" | sha256sum --check -
      - name: Incorporar el conjunto de datos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add codigo/Tema_02_Streaming_Tiempo_Real/recursos_kafka/sensores_deportivos_fatiga.csv
          git diff --cached --quiet || git commit -m "Añade datos sintéticos de sensores deportivos"
          git push
